plugins {
    id 'com.android.application'
}

def keystorePropertiesFile = rootProject.file("keystore.properties")
def keystoreProperties = new Properties()
keystoreProperties.load(new FileInputStream(keystorePropertiesFile))

android {
    namespace = 'com.simpleweb.affaldsguidedanmark'
    compileSdk = 37


    defaultConfig {
        applicationId = "com.simpleweb.affaldsguidedanmark"
        minSdk = 28
        targetSdk = 37
        versionCode = 42
        versionName = "3.3"

        testInstrumentationRunner = "androidx.test.runner.AndroidJUnitRunner"
    }

    signingConfigs {
        release {
            storeFile file(keystoreProperties['storeFile'])
            storePassword keystoreProperties['storePassword']
            keyAlias keystoreProperties['keyAlias']
            keyPassword keystoreProperties['keyPassword']
        }
    }

    buildTypes {
        debug {
            debuggable = true
            minifyEnabled = false
        }
        release {
            debuggable = false
            minifyEnabled = true
            shrinkResources = true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig = signingConfigs.release
        }
    }


    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }
    viewBinding {
        enabled = true
    }
    androidResources {
        noCompress += ['json']
    }
    bundle {
        language {
            // The app switches between Danish, English, and Arabic itself.
            enableSplit = false
        }
    }
}

dependencies {
    implementation 'com.google.android.play:review:2.0.2'
    implementation "androidx.activity:activity:1.13.0"
    implementation "androidx.core:core:1.19.1"
    implementation "androidx.navigation:navigation-fragment:2.10.2"
    implementation "androidx.navigation:navigation-ui:2.10.2"
    implementation "androidx.work:work-runtime:2.12.0"
    implementation 'com.google.guava:guava:33.7.2-android'

    implementation 'androidx.appcompat:appcompat:1.8.0'
    implementation 'com.google.android.material:material:1.14.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.2'

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'

    implementation 'org.apache.commons:commons-text:1.15.0'
    implementation 'com.google.code.gson:gson:2.14.0'
    implementation 'com.google.mlkit:image-labeling:17.0.9'
    implementation 'com.google.mlkit:text-recognition:16.0.1'
    implementation 'androidx.exifinterface:exifinterface:1.4.2'
}
